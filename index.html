<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0e" id="themeColor">
<title>无效标记｜小红书小工具版 V1.24</title>
<style>
:root{
  --bg:#0c0a0e;--fg:#eae4dc;--dim:#8b8279;--gold:#c9a97c;--line:rgba(201,169,124,.2);
  --panel:rgba(12,10,16,.88);--panel-soft:rgba(22,18,25,.78);--accent:#c9a97c;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--serif);overscroll-behavior:none}
body{transition:background .6s}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
#bar{position:relative;z-index:20;display:flex;align-items:center;grid-gap:8px;gap:8px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;font-size:12.5px;letter-spacing:.06em;color:var(--dim);flex:0 0 auto;background:linear-gradient(180deg,rgba(8,7,11,.9),rgba(8,7,11,.35));backdrop-filter:blur(14px)}
#bar .chap{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .bar-prog{width:64px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;flex:0 0 auto}
#bar .bar-prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
#bar button{background:rgba(255,255,255,.018);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11.5px;padding:6px 10px;border-radius:999px;cursor:pointer;letter-spacing:.08em;min-height:30px}
#bar button:hover{color:var(--gold);border-color:var(--gold)}

/* ---------- stage ---------- */
#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;z-index:10;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.wrap{max-width:660px;margin:0 auto;padding:4vh 30px 8vh}

/* ---------- read mode ---------- */
.paras .tp{font-size:19px;line-height:2.05;letter-spacing:.02em;margin:0 0 1.15em;text-align:justify;animation:fin .7s ease backwards}
.paras .tp:nth-child(2){animation-delay:.06s}
.paras .tp:nth-child(3){animation-delay:.12s}
.paras .tp:nth-child(4){animation-delay:.18s}
.paras .tp:nth-child(5){animation-delay:.24s}
.paras .tp:nth-child(6){animation-delay:.3s}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.first::first-letter{font-size:1.5em;color:var(--gold)}

/* ---------- galgame mode ---------- */
body[data-mode="gal"]{background:#05070b}
.gal{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 max(6vh,24px)}
.gal-scene{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:
  radial-gradient(120% 90% at 50% 12%,var(--tint) 0%,rgba(0,0,0,.2) 42%,#06070a 100%);
  transition:background .8s}
.gal-glow{position:absolute;left:50%;top:8%;width:70vw;width:min(70vw,520px);height:70vw;height:min(70vw,520px);transform:translateX(-50%);
  background:radial-gradient(circle,rgba(201,169,124,.22),transparent 62%);filter:blur(18px)}
.gal-vig{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.85)}
.gal-scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent)}
.gal-shadow{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:230px;height:330px;
  background:radial-gradient(52% 48% at 50% 26%,rgba(238,231,218,.20),rgba(238,231,218,.045) 66%,transparent 70%);
  border-radius:50% 50% 46% 46%/62% 62% 38% 38%;filter:blur(3px)}
.gal-name{position:relative;z-index:4;margin:0 0 12px 8%;font-size:12.5px;letter-spacing:.3em;color:var(--gold);opacity:.8}
.gal-box{position:relative;z-index:3;margin:0 14px;padding:24px 24px 26px;background:rgba(8,9,13,.82);
  border:1px solid rgba(201,169,124,.22);border-radius:6px;backdrop-filter:blur(9px);
  box-shadow:0 18px 50px rgba(0,0,0,.6);max-height:52vh;overflow-y:auto}
.gal-box .tp{font-size:16px;line-height:1.9;margin:0 0 .85em;letter-spacing:.02em}
.gal-box .tp:last-child{margin-bottom:0}
.gal-wm{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:34vw;font-size:min(34vw,300px);line-height:1;color:rgba(255,255,255,.035);letter-spacing:.1em;pointer-events:none;user-select:none}

/* ---------- continue ---------- */
#foot{flex:0 0 auto;position:relative;z-index:20;height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;background:linear-gradient(0deg,rgba(7,6,10,.96),rgba(7,6,10,.38));border-top:1px solid rgba(201,169,124,.08)}
#foot .hint{font-size:12px;letter-spacing:.3em;color:var(--dim);animation:breathe 2.4s ease-in-out infinite}
#foot .hint b{color:var(--gold);font-weight:400}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- chapter card ---------- */
.card{max-width:560px;margin:12vh auto 0;padding:0 30px;text-align:center}
.card .num{font-size:12px;letter-spacing:.5em;color:var(--gold);opacity:.8;margin-bottom:22px}
.card h1{font-size:30px;line-height:1.5;font-weight:400;margin:0 0 34px;letter-spacing:.06em}
.card .rule{width:38px;height:1px;background:var(--line);margin:0 auto 34px}
.card p{font-size:13px;line-height:2;color:var(--dim);letter-spacing:.08em}
.card .enter{margin-top:34px;display:inline-block;padding:11px 40px;border:1px solid var(--line);border-radius:999px;
  color:var(--fg);font-family:inherit;font-size:13.5px;letter-spacing:.3em;cursor:pointer;background:none;transition:.3s}
.card .enter:hover{border-color:var(--gold);color:var(--gold);letter-spacing:.36em}

/* ---------- choice ---------- */
.choice{max-width:600px;margin:0 auto;padding:9vh 28px 4vh}
.choice .prompt{font-size:19.5px;line-height:1.95;margin:0 0 42px;text-align:center;letter-spacing:.03em}
.choice .prompt .q{color:var(--gold);opacity:.6;margin-right:6px}
.choice ol{list-style:none;padding:0;margin:0}
.choice li{margin-bottom:14px}
.choice .opt{width:100%;text-align:left;background:rgba(255,255,255,.025);border:1px solid rgba(201,169,124,.16);
  color:var(--fg);font-family:inherit;font-size:15.5px;line-height:1.7;padding:17px 20px 17px 46px;border-radius:4px;
  cursor:pointer;position:relative;transition:.28s;letter-spacing:.02em}
.choice .opt:hover{background:rgba(201,169,124,.08);border-color:var(--gold);transform:translateX(3px)}
.choice .opt .idx{position:absolute;left:18px;top:17px;font-size:11px;color:var(--gold);opacity:.65;letter-spacing:.1em}
.choice .scene{margin-top:34px;text-align:center;font-size:11px;letter-spacing:.28em;color:rgba(139,130,121,.55)}

/* ---------- keypad ---------- */
.kp{max-width:420px;margin:0 auto;padding:6vh 26px 3vh;text-align:center}
.kp .prompt{font-size:17px;line-height:1.9;margin:0 0 22px}
.kp .slots{display:flex;justify-content:center;grid-gap:16px;gap:16px;margin:0 0 10px}
.kp .slot{width:30px;height:44px;border-bottom:1px solid rgba(201,169,124,.4);font-size:26px;line-height:44px;color:var(--gold)}
.kp .clues{font-size:11.5px;line-height:2;color:var(--dim);letter-spacing:.04em;margin:18px 0;text-align:left}
.kp .clues div{opacity:.85}
.kp .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:9px;gap:9px;margin-top:22px}
.kp .pad button{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);color:var(--fg);
  font-family:inherit;font-size:19px;height:52px;border-radius:5px;cursor:pointer;transition:.18s}
.kp .pad button:hover{background:rgba(201,169,124,.12);border-color:rgba(201,169,124,.4)}
.kp .pad button.fn{font-size:12px;letter-spacing:.2em;color:var(--dim)}
.kp .fb{min-height:52px;font-size:13.5px;line-height:1.9;color:#d8b98f;margin:18px 0 0;letter-spacing:.03em}
.kp .fb.tip{color:rgba(139,130,121,.9);font-size:12px}
.kp .fb.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* ---------- overlay ---------- */
#ov{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:120;background:rgba(6,5,8,.985);
  display:none;overflow-y:auto}
#ov.on{display:block}
#ov .in{max-width:600px;margin:0 auto;padding:10vh 32px 12vh;text-align:center}
#ov .in.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:0;padding-bottom:0}
#ov .in p{font-size:17px;line-height:2.05;margin:0 0 1.1em;text-align:left}
#ov .btns{margin-top:46px;display:flex;grid-gap:12px;gap:12px;justify-content:center;flex-wrap:wrap}
#ov .btns button{padding:11px 26px;border:1px solid var(--line);background:none;color:var(--fg);
  font-family:inherit;font-size:13px;letter-spacing:.2em;border-radius:999px;cursor:pointer;transition:.25s}
#ov .btns button:hover{border-color:var(--gold);color:var(--gold)}
#ov .btns button.pri{background:rgba(201,169,124,.14);border-color:rgba(201,169,124,.5)}

/* ending slab */
.end .kicker{font-size:11.5px;letter-spacing:.5em;color:var(--gold);margin-bottom:26px}
.end h2{font-size:34px;font-weight:400;letter-spacing:.2em;margin:0 0 14px}
.end .mood{font-size:12.5px;letter-spacing:.24em;color:var(--dim);margin-bottom:44px}
.end .rule2{width:34px;height:1px;background:var(--line);margin:0 auto 40px}
.rollback-gate{max-width:520px;margin:0 auto;text-align:center}.rollback-gate h2{font-size:29px;font-weight:400;letter-spacing:.16em;margin:10px 0 20px}.rollback-gate p{font-size:15px;line-height:2;text-align:center!important;color:var(--fg)}.rollback-gate .rollback-note{font-size:12px;color:var(--dim)}.rollback-gate .btns a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:11px 26px;border:1px solid var(--line);color:var(--fg);font-family:inherit;font-size:13px;letter-spacing:.2em;border-radius:999px}.rollback-gate .btns a:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- start ---------- */
#start{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#09070c}
#start .start-cover{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;pointer-events:none}
#start::before{content:"";position:absolute;z-index:1;top:0;right:0;bottom:0;left:0;inset:0;background:linear-gradient(180deg,rgba(7,5,10,.04) 34%,rgba(7,5,10,.1) 48%,rgba(7,5,10,.88) 91%,rgba(7,5,10,.98));pointer-events:none}
#start .in{position:relative;z-index:2;width:100%;text-align:center;padding:0 18px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(7,5,10,.62) 24%,rgba(7,5,10,.84))}
#start .en{font-size:10.5px;letter-spacing:.55em;color:var(--gold);opacity:.7;margin-bottom:24px}
#start h1{font-size:44px;font-weight:400;letter-spacing:.34em;margin:0 0 6px;text-indent:.34em}
#start .sub{font-size:12.5px;letter-spacing:.28em;color:var(--dim);margin-bottom:56px}
#start .rule3{width:1px;height:46px;background:linear-gradient(var(--gold),transparent);margin:0 auto 40px;opacity:.5}
#start .modes{display:flex;grid-gap:14px;gap:14px;justify-content:center;flex-wrap:wrap}
#start .modes button{padding:13px 30px;border:1px solid var(--line);background:none;color:var(--fg);font-family:inherit;
  font-size:13.5px;letter-spacing:.24em;border-radius:999px;cursor:pointer;transition:.3s}
#start .modes button:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,124,.07)}
#start .modes button small{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-top:5px}
#start .resume{margin-top:34px}
#start .resume button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:12px;
  letter-spacing:.2em;cursor:pointer;border-bottom:1px solid rgba(139,130,121,.3);padding:0 0 3px}
#start .resume button:hover{color:var(--gold);border-color:var(--gold)}
#start .foot{margin-top:60px;font-size:10.5px;letter-spacing:.24em;color:rgba(139,130,121,.5)}
#start .en,#start h1,#start .sub,#start .rule3{display:none}
#start .modes{padding-top:22px}
#start .modes button{background:rgba(9,7,12,.48);backdrop-filter:blur(8px)}
#start .start-secondary{margin-top:14px}
#start .start-secondary button{color:rgba(245,238,229,.78);border-color:rgba(201,169,124,.28);text-shadow:0 1px 8px #000}
#start .foot{margin-top:18px;color:rgba(245,238,229,.5);text-shadow:0 1px 8px #000}

@media(max-width:520px){
  .wrap{padding:2vh 22px 6vh}
  .paras .tp{font-size:17.5px;line-height:1.95}
  .gal-box{margin:0 10px;padding:20px 18px 22px;max-height:54vh}
  .gal-box .tp{font-size:15px;line-height:1.82}
  .choice{padding:6vh 20px 3vh}
  .choice .prompt{font-size:17.5px;margin-bottom:32px}
  .choice .opt{font-size:14.5px;padding:15px 16px 15px 42px}
  .card h1{font-size:24px}
  #start h1{font-size:34px}
  .end h2{font-size:27px}
  #ov .in{padding:8vh 24px 10vh}
  #ov .in p{font-size:15.5px;line-height:1.95}
}


/* Standalone player interface */
:root{--paper:#161419;--paper2:#201c22}
#bar{grid-gap:7px;gap:7px;padding:12px 14px 10px;min-height:56px}
#bar button{white-space:nowrap}
#bar #btnEditor{border-color:rgba(201,169,124,.55);color:#e3c7a0}
#bar .bar-prog{width:58px}
#stage{scroll-behavior:smooth}
#foot{height:58px;min-height:58px;border-top:1px solid rgba(201,169,124,.08)}
.reading-counter{color:var(--dim);font-size:11px;letter-spacing:.1em;text-align:right;padding-top:2vh}
.reading-prompt{font-size:12px;text-align:center;color:var(--dim);margin:24px auto}
.gal-choice{position:relative;z-index:5}
.gal{min-height:100%;padding:0 0 4vh}
.gal-box{max-height:57vh;max-height:min(57vh,470px);width:calc(100% - 28px);max-width:640px;margin-left:auto;margin-right:auto;min-height:140px;display:flex;align-items:center}
.gal-box .tp{width:100%;font-size:18px;line-height:2.0}
.gal-name{max-width:640px;width:85%;margin-left:auto;margin-right:auto}
.gal-beat{position:relative;z-index:4;margin:10px auto 0;color:rgba(234,228,220,.5);font-size:11px;letter-spacing:.14em}
.extra-echo{margin:25px 0 0;padding:15px 18px;border-left:2px solid var(--gold);color:#d9c1a1;background:rgba(201,169,124,.07);font-size:15px;line-height:1.9}
.doc-panel,.case-panel,.dance-panel,.memory-panel,.invest-panel{max-width:650px;margin:0 auto;padding:5vh 24px 8vh}
body[data-node-type="document"] .doc-panel,body[data-node-type="rhythm"] .dance-panel,body[data-node-type="casefile"] .case-panel,body[data-node-type="memory"] .memory-panel,body[data-node-type="gallery"] .case-panel,body[data-node-type="keypad"] .kp{position:relative;max-width:650px;margin:3vh auto 7vh;border:1px solid rgba(209,173,121,.15);border-radius:12px;background:linear-gradient(145deg,rgba(20,18,25,.96),rgba(8,10,14,.98));box-shadow:0 24px 70px rgba(0,0,0,.32)}
body[data-node-type="keypad"] .kp{padding-top:5vh;padding-bottom:6vh}
.game-eyebrow{font-size:11px;color:var(--gold);letter-spacing:.3em;margin-bottom:16px}
.game-title{font-size:25px;line-height:1.5;font-weight:400;margin:0 0 14px}
.game-desc{font-size:14px;line-height:1.9;color:var(--dim);margin:0 0 26px}
.paper{background:#e7dfd0;color:#26242a;padding:22px;border-radius:4px;box-shadow:0 15px 44px rgba(0,0,0,.25);font-family:var(--serif)}
.paper-head{font-size:16px;font-weight:bold;letter-spacing:.15em;text-align:center;padding-bottom:13px;border-bottom:1px solid #c5b9a4}
.paper-note{font-size:11px;color:#77716b;text-align:center;margin:11px 0 20px}
.clause{display:block;width:100%;border:1px solid #d1c6b2;background:rgba(255,255,255,.26);text-align:left;padding:12px 14px;margin-bottom:8px;color:#383039;font-family:inherit;cursor:pointer;border-radius:3px}
.clause.active{border-color:#85633c;background:rgba(201,169,124,.22)}
.clause small{font-size:11px;color:#675c4e;display:block;margin-bottom:5px}
.clause span{font-size:13px;line-height:1.9;display:block}
.clause em{display:block;font-size:12px;color:#776040;margin-top:9px;font-style:normal;border-top:1px dashed #bfb29e;padding-top:7px}
.doc-bottom{display:flex;align-items:center;justify-content:space-between;grid-gap:12px;gap:12px;padding:12px 0}
.btn-gold{background:rgba(201,169,124,.16);border:1px solid rgba(201,169,124,.56);color:var(--fg);padding:12px 20px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:.06em}
.btn-ghost{background:none;border:1px solid rgba(201,169,124,.24);color:var(--dim);padding:11px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.btn-gold:hover,.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold:disabled{opacity:.42;cursor:not-allowed}
.game-note{color:var(--dim);font-size:12px;line-height:1.8}
.info-panel{padding:12px 14px;border-left:2px solid var(--gold);background:rgba(201,169,124,.07);font-size:13px;line-height:1.9;margin:14px 0}
.invest-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:9px;gap:9px;margin:14px 0 20px}
.invest-item{border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.024);color:var(--fg);padding:15px 9px;font-family:inherit;cursor:pointer;font-size:12px;line-height:1.7;min-height:86px}
.invest-item.seen{background:rgba(201,169,124,.1);border-color:rgba(201,169,124,.52)}
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:10px;gap:10px;margin:16px 0}
.case-card{border:1px solid rgba(201,169,124,.24);background:rgba(255,255,255,.025);border-radius:5px;min-height:138px;color:var(--fg);padding:16px;text-align:left;cursor:pointer;font-family:inherit}
.case-card.seen{background:rgba(201,169,124,.1);border-color:var(--gold)}
.case-card .num{color:var(--gold);font-size:11px;margin-bottom:15px}
.case-card b{font-size:15px;display:block;font-weight:400;margin-bottom:7px}
.case-card small{font-size:11px;color:var(--dim);display:block;line-height:1.7}
.dance-scene{margin:32px auto;text-align:center;border:1px solid var(--line);border-radius:50% 50% 10px 10px/38% 38% 10px 10px;min-height:185px;max-width:380px;background:radial-gradient(ellipse at center,rgba(201,169,124,.19),rgba(201,169,124,.02) 70%);padding:55px 20px 25px}
.dance-scenescript{font-size:18px;line-height:2;color:var(--fg)}
.dance-controls{display:flex;grid-gap:20px;gap:20px;justify-content:center;margin:25px auto}
.dance-key{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);color:var(--fg);font-size:21px;cursor:pointer;background:rgba(255,255,255,.02);font-family:inherit}
.dance-key.next{border-color:var(--gold);background:rgba(201,169,124,.16);color:var(--gold)}
.gate-v11-stage{position:relative;isolation:isolate;min-height:100%;display:grid;place-items:center;padding:clamp(22px,5vh,52px) 18px 94px;background:linear-gradient(145deg,#090c10,#111820);color:#f0ece5}
.gate-v11-stage::before{content:"";position:absolute;z-index:-1;top:0;right:0;bottom:0;left:0;inset:0;background:radial-gradient(circle at 18% 30%,rgba(201,169,124,.12),transparent 30%),radial-gradient(circle at 80% 20%,rgba(72,132,150,.13),transparent 35%)}

/* V1.9 navigation, ending archive, and dual themes */
#bar .chap{min-width:0}
#btnContents,#btnEndings,#btnTheme{width:32px;padding:0;display:grid;place-items:center;font-size:15px;letter-spacing:0}
#navScrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:89;background:rgba(4,6,9,.52);opacity:0;pointer-events:none;transition:opacity .24s}
#navScrim.on{opacity:1;pointer-events:auto}
#chapterDrawer{position:fixed;z-index:90;right:0;top:0;bottom:0;width:340px;width:min(340px,88vw);transform:translateX(102%);transition:transform .28s ease;background:#101218;border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.34);display:flex;flex-direction:column}
#chapterDrawer.on{transform:none}
.side-head{display:flex;align-items:center;justify-content:space-between;grid-gap:12px;gap:12px;padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:18px;font-weight:400;letter-spacing:.16em;margin:0}.icon-close{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--fg);font:18px/1 var(--serif);cursor:pointer;border-radius:50%}
.chapter-list{padding:12px 12px 30px;overflow:auto;display:grid;gap:5px}
.chapter-access-note{margin:2px 0 8px;padding:10px 11px;border:1px solid var(--line);border-radius:5px;color:var(--dim);font-size:11px;line-height:1.7;letter-spacing:.04em}.chapter-access-note.open{color:var(--gold);background:rgba(209,173,121,.06)}
.chapter-link{display:grid;grid-template-columns:42px 1fr auto;align-items:center;grid-gap:10px;gap:10px;width:100%;padding:12px;border:1px solid transparent;background:none;color:var(--fg);font-family:inherit;text-align:left;cursor:pointer;border-radius:5px}
.chapter-link:hover,.chapter-link.current{border-color:var(--line);background:rgba(209,173,121,.07)}
